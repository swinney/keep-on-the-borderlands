name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. The Ralph Loop will commit fast;
# don't waste minutes on stale revisions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff · mypy --strict · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e .[dev]

      - name: ruff format (check)
        run: ruff format --check .

      - name: ruff lint
        run: ruff check .

      - name: mypy --strict
        run: mypy

      - name: pytest
        run: pytest
