[project]
name = "keep-on-the-borderlands"
version = "0.0.0"
description = "An open-source persistent multiplayer text MUD adapting B2: The Keep on the Borderlands"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Austin Swinney", email = "swinney@gmail.com" }]

# Runtime dependency pinned in Phase 1 (M0). Evennia transitively pins Django
# and Twisted. Exact pin for Ralph-Loop reproducibility — bumping it is a
# deliberate, reviewable change rather than silent drift across loop turns.
dependencies = [
  "evennia==6.0.0",
]

[project.optional-dependencies]
dev = [
  # Pin the gate tools exactly so host, container, and CI agree turn-to-turn
  # (a Ralph Loop must not see a gate pass in one env and fail in another).
  "ruff==0.15.15",
  "mypy==2.1.0",
  "pytest",
  "pytest-cov",
  "pytest-django",  # needed once tests boot Django/Evennia (M2+); harmless until then
  "pre-commit",
]
# Documentation site (MkDocs + Material). Built in CI and published to Pages.
docs = [
  "mkdocs-material",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# No packages yet. World/typeclasses/commands get added under their own
# top-level packages as the loop creates them.
packages = []

# ────────────────────────────────────────────────────────────────────────────
# ruff
# ────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  # Only Evennia-generated plumbing we don't author (ADR 0004). First-party
  # code under mudgame/ — world/, typeclasses/, commands/ — IS linted.
  "mudgame/server",
  "mudgame/web",
  ".ralph",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # flake8-bugbear
  "UP",            # pyupgrade
  "SIM",           # flake8-simplify
  "RUF",           # ruff-specific
  "C4",            # comprehensions
  "PL",            # pylint subset
]
ignore = [
  "E501",          # line length is the formatter's job
  "PLR0913",       # too-many-arguments — design call, not a lint issue
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert against literal expected values; naming every one
# as a constant hurts readability. Keep PLR2004 on for production code only.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.isort]
# Our Evennia game-dir packages — gives first-party imports their own group.
known-first-party = ["world", "typeclasses", "commands", "server", "web"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ────────────────────────────────────────────────────────────────────────────
# mypy — strict per CLAUDE.md §3, scoped to first-party code only
# ────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
# mudgame/ is the Evennia game-dir root and is on sys.path at runtime, so
# first-party code imports as `world.rules.*`. Mirror that for mypy.
mypy_path = "mudgame"
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_decorators = true

# Strict scope = pure, Evennia-free first-party modules only (ADR 0004). Grow
# this list as new pure modules land. Evennia-coupled code (typeclasses,
# managers, commands) stays OUT of strict scope: its untyped base classes make
# --strict intractable. Restore the evennia/django override below at M2, when
# first-party code first imports evennia.
files = ["tests", "mudgame/world/rules", "mudgame/world/factions", "mudgame/world/henchmen", "mudgame/world/repop", "mudgame/world/season"]

# First-party engine tests (tests/engine/) now import evennia/django, so the
# missing-imports override below is "used" — restoring it earlier triggered
# "unused override" warnings under warn_unused_configs (M2; see M0 handoff note
# in tasks.md). Evennia/Django ship no inline types; --strict on them is
# intractable (ADR 0004), so we silence missing-import errors for those packages
# while keeping our own code strict.
[[tool.mypy.overrides]]
module = ["evennia.*", "django.*"]
ignore_missing_imports = true

# ────────────────────────────────────────────────────────────────────────────
# pytest
# ────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Put the Evennia game-dir root on sys.path so tests import first-party code
# as `world.rules.*` (matches runtime; ADR 0004).
pythonpath = ["mudgame"]
addopts = "-ra --strict-markers --strict-config"
# Engine tests (tests/engine/, and M2+ combat-on-the-engine suites) boot Django
# via pytest-django. The shim adds TEST_ENVIRONMENT and fixes GAME_DIR; see
# mudgame/server/conf/test_settings.py. Pure rules tests stay Django-free —
# they request no DB fixture, so no test database is created for them.
DJANGO_SETTINGS_MODULE = "server.conf.test_settings"
